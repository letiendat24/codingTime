name: CD

on:
  workflow_run:
    workflows:
      - Docker Publish
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://codingtime.click

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/codingtime_deploy
          chmod 600 ~/.ssh/codingtime_deploy
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh \
            -i ~/.ssh/codingtime_deploy \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << EOF
              set -e

              cd /opt/codingtime

              git fetch origin
              git checkout main
              git pull --ff-only origin main

              sed -i "s/^CODESYNC_IMAGE_TAG=.*/CODESYNC_IMAGE_TAG=${DEPLOY_SHA}/" .env.production

              docker compose \
                --env-file .env.production \
                -f infra/docker/docker-compose.deploy.yml \
                pull

              docker compose \
                --env-file .env.production \
                -f infra/docker/docker-compose.deploy.yml \
                --profile migration \
                run --rm backend-migrate

              docker compose \
                --env-file .env.production \
                -f infra/docker/docker-compose.deploy.yml \
                up -d

              curl -f https://codingtime.click/api/v1/ready
          EOF