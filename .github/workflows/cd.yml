name: CD

on:
  workflow_run:
    workflows:
      - Docker Publish
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://codingtime.click

    steps:
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/codingtime_deploy
          chmod 600 ~/.ssh/codingtime_deploy

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      
      - name: Deploy to VPS
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/codingtime_deploy \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "bash -se -- '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail

          DEPLOY_SHA="$1"
          cd /opt/codingtime

          sed -i \
            "s/^CODESYNC_IMAGE_TAG=.*/CODESYNC_IMAGE_TAG=$DEPLOY_SHA/" \
            .env.production

          COMPOSE="docker compose --env-file .env.production -f infra/docker/docker-compose.deploy.yml"

          $COMPOSE pull \
            backend frontend video-worker \
            code-worker code-judge-worker project-grading-worker

          $COMPOSE --profile migration run --rm --no-deps backend-migrate

          $COMPOSE up -d --no-deps \
            backend frontend video-worker \
            code-worker code-judge-worker project-grading-worker

          curl --fail --retry 5 --retry-delay 3 \
            https://codingtime.click/api/v1/ready
          REMOTE
