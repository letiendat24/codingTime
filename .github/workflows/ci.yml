name: CI
on:
  pull_request:
    branches:
      - main
  
  push:
    branches:
      - main
  
jobs:
  quality:
    name: Quality check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codesync
          POSTGRES_PASSWORD: codesync_test
          POSTGRES_DB: codesync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codesync -d codesync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env: 
      NODE_ENV: test
      DATABASE_URL: postgresql://codesync:codesync_test@localhost:5432/codesync_test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: 
          run_install: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Intall dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint 
      
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build