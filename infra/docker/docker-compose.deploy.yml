name: codesync-deploy

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: codesync-prod-nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/codesync.prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend:
    image: ${CODESYNC_IMAGE_REPOSITORY:?Set CODESYNC_IMAGE_REPOSITORY}/frontend:${CODESYNC_IMAGE_TAG:?Set CODESYNC_IMAGE_TAG}
    platform: ${CODESYNC_IMAGE_PLATFORM:-linux/amd64}
    container_name: codesync-prod-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

  backend:
    image: ${CODESYNC_IMAGE_REPOSITORY:?Set CODESYNC_IMAGE_REPOSITORY}/backend:${CODESYNC_IMAGE_TAG:?Set CODESYNC_IMAGE_TAG}
    platform: ${CODESYNC_IMAGE_PLATFORM:-linux/amd64}
    container_name: codesync-prod-backend
    env_file:
      - ${CODESYNC_RUNTIME_ENV_FILE:-../../.env.production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:' + (process.env.API_PORT || 4000) + '/api/v1/ready', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend-migrate:
    image: ${CODESYNC_IMAGE_REPOSITORY:?Set CODESYNC_IMAGE_REPOSITORY}/backend:${CODESYNC_IMAGE_TAG:?Set CODESYNC_IMAGE_TAG}
    platform: ${CODESYNC_IMAGE_PLATFORM:-linux/amd64}
    container_name: codesync-prod-backend-migrate
    profiles: ["migration"]
    env_file:
      - ${CODESYNC_RUNTIME_ENV_FILE:-../../.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "db:migrate:deploy"]
    restart: "no"

  video-worker:
    image: ${CODESYNC_IMAGE_REPOSITORY:?Set CODESYNC_IMAGE_REPOSITORY}/worker-video-processing:${CODESYNC_IMAGE_TAG:?Set CODESYNC_IMAGE_TAG}
    platform: ${CODESYNC_IMAGE_PLATFORM:-linux/amd64}
    container_name: codesync-prod-video-worker
    env_file:
      - ${CODESYNC_RUNTIME_ENV_FILE:-../../.env.production}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  code-worker:
    image: ${CODESYNC_IMAGE_REPOSITORY:?Set CODESYNC_IMAGE_REPOSITORY}/worker-code-execution:${CODESYNC_IMAGE_TAG:?Set CODESYNC_IMAGE_TAG}
    platform: ${CODESYNC_IMAGE_PLATFORM:-linux/amd64}
    container_name: codesync-prod-code-worker
    env_file:
      - ${CODESYNC_RUNTIME_ENV_FILE:-../../.env.production}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped

  code-judge-worker:
    image: ${CODESYNC_IMAGE_REPOSITORY:?Set CODESYNC_IMAGE_REPOSITORY}/worker-code-judge:${CODESYNC_IMAGE_TAG:?Set CODESYNC_IMAGE_TAG}
    platform: ${CODESYNC_IMAGE_PLATFORM:-linux/amd64}
    container_name: codesync-prod-code-judge-worker
    env_file:
      - ${CODESYNC_RUNTIME_ENV_FILE:-../../.env.production}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped

  project-grading-worker:
    image: ${CODESYNC_IMAGE_REPOSITORY:?Set CODESYNC_IMAGE_REPOSITORY}/worker-project-grading:${CODESYNC_IMAGE_TAG:?Set CODESYNC_IMAGE_TAG}
    platform: ${CODESYNC_IMAGE_PLATFORM:-linux/amd64}
    container_name: codesync-prod-project-grading-worker
    env_file:
      - ${CODESYNC_RUNTIME_ENV_FILE:-../../.env.production}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: codesync-prod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codesync-prod-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: codesync-prod-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_MANAGEMENT_BIND:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: codesync-prod-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: codesync-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
